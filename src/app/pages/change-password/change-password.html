<div class="flex items-center justify-center min-h-screen bg-muted/40 p-4">
  <div hlmCard class="w-full max-w-sm">
    <div hlmCardHeader>
      <h1 class="text-2xl font-semibold text-center">Change Password</h1>
      <p class="text-sm text-muted-foreground text-center">Update your password</p>
    </div>

    <div hlmCardContent>
      <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" class="grid gap-4">

        <!-- Current Password -->
        <div class="grid gap-2">
          <label hlmLabel for="currentPassword">Current Password</label>

          <input hlmInput id="currentPassword" type="password" formControlName="currentPassword"
            [class.border-destructive]="
              changePasswordForm.controls.currentPassword.invalid &&
              changePasswordForm.controls.currentPassword.touched
            " />

          <div *ngIf="
              changePasswordForm.controls.currentPassword.invalid &&
              changePasswordForm.controls.currentPassword.touched
            " class="text-destructive text-sm">
            <div *ngIf="changePasswordForm.controls.currentPassword.errors?.['required']">
              Current password is required.
            </div>
          </div>
        </div>

        <!-- New Password -->
        <div class="grid gap-2">
          <label hlmLabel for="newPassword">New Password</label>

          <input hlmInput id="newPassword" type="password" formControlName="newPassword" [class.border-destructive]="
              changePasswordForm.controls.newPassword.invalid &&
              changePasswordForm.controls.newPassword.touched
            " />

          <div *ngIf="
              changePasswordForm.controls.newPassword.invalid &&
              changePasswordForm.controls.newPassword.touched
            " class="text-destructive text-sm">
            <div *ngIf="changePasswordForm.controls.newPassword.errors?.['required']">
              New password is required.
            </div>

            <div *ngIf="changePasswordForm.controls.newPassword.errors?.['minlength']">
              New password must be at least 6 characters.
            </div>
          </div>
        </div>

        <!-- Confirm New Password -->
        <div class="grid gap-2">
          <label hlmLabel for="confirmNewPassword">Confirm New Password</label>

          <input hlmInput id="confirmNewPassword" type="password" formControlName="confirmNewPassword"
            [class.border-destructive]="
              changePasswordForm.controls.confirmNewPassword.invalid &&
              changePasswordForm.controls.confirmNewPassword.touched
            " />

          <div *ngIf="
              changePasswordForm.controls.confirmNewPassword.invalid &&
              changePasswordForm.controls.confirmNewPassword.touched
            " class="text-destructive text-sm">
            <div *ngIf="changePasswordForm.controls.confirmNewPassword.errors?.['required']">
              Confirm new password is required.
            </div>

            <div *ngIf="
                changePasswordForm.errors?.['passwordMismatch'] &&
                changePasswordForm.controls.confirmNewPassword.valid &&
                changePasswordForm.controls.confirmNewPassword.touched
              ">
              Passwords do not match.
            </div>
          </div>
        </div>

        <!-- Button -->
        <button hlmBtn type="submit" [disabled]="loading" class="w-full">
          <span *ngIf="loading"
            class="mr-2 inline-block h-4 w-4 animate-spin rounded-full border-2 border-primary border-r-transparent"></span>
          Change Password
        </button>

      </form>

      <div *ngIf="errorMessage" class="mt-4 text-center text-destructive">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="mt-4 text-center text-green-600">
        {{ successMessage }}
      </div>
    </div>
  </div>
</div>
