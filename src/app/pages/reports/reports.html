<div class="container mx-auto px-4 py-8">
    <!-- Header Section -->
    <div class="mb-8">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <div>
                <h1 class="text-4xl font-bold">Dashboard de Tráfico</h1>
                <p class="mt-2 text-lg text-muted-foreground">Análisis de vehículos y peatones en tiempo real</p>
            </div>
            <div class="flex flex-col gap-3 sm:flex-row">
                <select class="w-full sm:w-[180px] rounded-md border border-input bg-background px-3 py-2 text-sm"
                    (change)="onPeriodChange($event)" aria-label="Seleccionar período">
                    <option value="7d">Últimos 7 días</option>
                    <option value="30d">Últimos 30 días</option>
                    <option value="90d" selected>Últimos 3 meses</option>
                    <option value="1y">Último año</option>
                </select>
                <select class="w-full sm:w-[200px] rounded-md border border-input bg-background px-3 py-2 text-sm"
                    (change)="onLocationChange($event)" aria-label="Seleccionar ubicación">
                    <option value="all" selected>Todas las ubicaciones</option>
                    <option value="center">Centro de la ciudad</option>
                    <option value="north">Zona Norte</option>
                    <option value="south">Zona Sur</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Summary Statistics Cards -->
    <div class="mb-8 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
        @for (stat of summaryStats; track stat.title) {
        <section hlmCard class="group relative overflow-hidden">
            <div hlmCardContent class="p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium">{{ stat.title }}</p>
                        <p class="mt-2 text-3xl font-bold">{{ stat.value }}</p>
                        <div class="mt-2 flex items-center gap-2">
                            <span class="text-sm font-medium" [class]="stat.color">
                                {{ stat.change }}
                            </span>
                            @if (stat.trend === 'up') {
                            <lucide-icon [name]="TrendingUpIcon" class="h-4 w-4 text-green-500" />
                            }
                        </div>
                    </div>
                    <div class="rounded-full p-3 bg-muted/50">
                        <lucide-icon [name]="stat.icon" class="h-6 w-6" [class]="stat.color" />
                    </div>
                </div>
            </div>
        </section>
        }
    </div>

    <!-- Charts Section -->
    <div class="space-y-8">
        <!-- Main Chart -->
        <div class="w-full">
            <app-area-chart />
        </div>

        <!-- Secondary Charts Grid -->
        <div class="grid grid-cols-1 gap-8 lg:grid-cols-2">
            <app-bar-chart />
            <app-pie-chart />
        </div>
    </div>

    <!-- Footer Info -->
    <div class="mt-8 text-center">
        <p class="text-sm text-muted-foreground">
            Última actualización: {{ lastUpdate | date:'medium':'':'es' }}
        </p>
    </div>
</div>
