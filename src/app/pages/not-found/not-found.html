<div class="flex min-h-screen items-center justify-center bg-background p-4">
  <div class="w-full max-w-md space-y-6">
    <!-- Icono y título -->
    <div class="text-center">
      <div
        class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-destructive/10"
      >
        <lucide-icon [name]="FileXIcon" class="h-8 w-8 text-destructive"></lucide-icon>
      </div>
      <h1 class="text-2xl font-bold text-foreground">Página no Encontrada</h1>
      <p class="mt-2 text-muted-foreground">La página que buscas no existe o ha sido movida</p>
    </div>

    <!-- Información del error -->
    <div hlmCard class="rounded-lg border bg-card p-4 text-center">
      <p class="text-sm text-muted-foreground">Verifica la URL o regresa a la página principal</p>
    </div>

    <!-- Acciones -->
    <div class="space-y-3">
      <button hlmBtn (click)="goHome()" class="w-full">
        <lucide-icon [name]="HouseIcon" class="mr-2 h-4 w-4"></lucide-icon>
        Ir al inicio
      </button>

      <button hlmBtn (click)="goBack()" variant="outline" class="w-full">
        <lucide-icon [name]="ArrowLeftIcon" class="mr-2 h-4 w-4"></lucide-icon>
        Volver atrás
      </button>
    </div>
  </div>
</div>
