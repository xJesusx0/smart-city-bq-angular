<div class="flex min-h-svh flex-col items-center justify-center bg-muted p-6 md:p-10">
  <div class="w-full max-w-md">
    <div class="flex flex-col gap-6">
      <div hlmCard class="overflow-hidden p-0">
        <div hlmCardContent class="grid p-0">
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="p-6 md:p-8">
            <div class="flex flex-col gap-6">
              <!-- Header -->
              <div class="flex flex-col items-center gap-2 text-center">
                <h1 class="text-2xl font-bold">Bienvenido</h1>
                <p class="text-balance text-muted-foreground">Entra a tu cuenta de Smart City</p>
              </div>

              <!-- Username -->
              <div class="grid gap-2">
                <label hlmLabel for="username">Usuario</label>
                <input
                  hlmInput
                  id="username"
                  type="text"
                  placeholder="tu@email.com"
                  formControlName="username"
                  [disabled]="isPending()"
                  autocomplete="username"
                />
              </div>

              <!-- Password -->
              <div class="grid gap-2">
                <label hlmLabel for="password">Contraseña</label>
                <input
                  hlmInput
                  id="password"
                  type="password"
                  formControlName="password"
                  [disabled]="isPending()"
                  autocomplete="current-password"
                />
              </div>

              <!-- Error message -->
              @if (errorMessage()) {
                <div class="rounded-md bg-destructive/10 p-3">
                  <p class="text-sm text-destructive">{{ errorMessage() }}</p>
                </div>
              }

              <!-- Submit button -->
              <button hlmBtn type="submit" [disabled]="isPending()" class="w-full cursor-pointer">
                @if (isPending()) {
                  <lucide-icon [name]="LoaderIcon" class="mr-2 h-4 w-4 animate-spin" />
                }
                {{ isPending() ? 'Iniciando sesión...' : 'Iniciar sesión' }}
              </button>

              <!-- Separator -->
              <div class="relative">
                <div class="absolute inset-0 flex items-center">
                  <span class="w-full border-t border-border"></span>
                </div>
                <div class="relative flex justify-center text-xs uppercase">
                  <span class="bg-card px-2 text-muted-foreground">O Continúa Con</span>
                </div>
              </div>

              <!-- Google login button -->
              <div class="relative w-full h-10 overflow-hidden rounded-md border">
                <!-- Capa 1: Botón visual (Lo que el usuario ve) -->
                <button
                  hlmBtn
                  variant="outline"
                  type="button"
                  tabindex="-1"
                  class="absolute inset-0 w-full flex items-center justify-center gap-2 pointer-events-none bg-background border-none cursor-pointer"
                >
                  <svg viewBox="0 0 24 24" class="h-4 w-4" aria-hidden="true">
                    <path
                      d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                      fill="#4285F4"
                    />
                    <path
                      d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                      fill="#34A853"
                    />
                    <path
                      d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                      fill="#FBBC05"
                    />
                    <path
                      d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                      fill="#EA4335"
                    />
                  </svg>
                  <span class="font-medium text-sm">
                    {{ isGooglePending() ? 'Iniciando sesión...' : 'Continuar con Google' }}
                  </span>
                </button>

                <!-- Capa 2: Botón real de Google (Totalmente invisible, escalado x5 para cubrir todo) -->
                <div
                  #googleContainer
                  class="absolute inset-0 z-50 opacity-0 scale-[5] origin-center cursor-pointer flex items-center justify-center"
                  aria-hidden="true"
                ></div>
              </div>

              <!-- Microsoft login button -->
              <button
                hlmBtn
                variant="outline"
                type="button"
                (click)="handleMicrosoftLogin()"
                [disabled]="isMicrosoftPending()"
                class="w-full gap-2 cursor-pointer"
                aria-label="Continuar con Microsoft"
              >
                <svg viewBox="0 0 21 21" class="h-4 w-4" aria-hidden="true">
                  <rect x="1" y="1" width="9" height="9" fill="#F25022" />
                  <rect x="1" y="11" width="9" height="9" fill="#00A4EF" />
                  <rect x="11" y="1" width="9" height="9" fill="#7FBA00" />
                  <rect x="11" y="11" width="9" height="9" fill="#FFB900" />
                </svg>
                {{ isMicrosoftPending() ? 'Iniciando sesión...' : 'Continuar con Microsoft' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
